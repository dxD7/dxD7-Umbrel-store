manifestVersion: 1
id: dxd7-deluge-vpn
category: networking
name: DelugeVPN
version: "2.2.0"
tagline: Deluge torrent client with a built-in VPN and kill switch
icon: https://raw.githubusercontent.com/dxD7/dxD7-Umbrel-store/main/dxd7-deluge-vpn/icon.png
description: >-
  Deluge torrent client that runs entirely inside a VPN tunnel with a kill
  switch, packaged from the binhex/arch-delugevpn image. Preconfigured for
  Private Internet Access (WireGuard, with a choice of server location) and
  switchable to other providers that binhex supports (AirVPN, ProtonVPN, or
  your own config files).


  FIRST LAUNCH: open the app and fill in the setup page with your VPN
  provider, protocol, username and password. Deluge starts automatically
  afterwards, which can take a minute or two. The Deluge web UI password is
  "deluge" by default - please change it in Deluge's preferences after your
  first login.


  HOME-SCREEN WIDGETS: right-click the Umbrel home screen, choose Edit
  widgets, and add the DelugeVPN widgets to see your download counts and active
  torrents at a glance. Widgets show torrent names; the README explains how to
  hide them.


  This is an unofficial package and is not affiliated with binhex or any VPN
  provider.
developer: binhex
website: https://github.com/binhex/arch-delugevpn
dependencies: []
repo: https://github.com/dxD7/dxD7-Umbrel-store
support: https://github.com/dxD7/dxD7-Umbrel-store/issues
port: 8112
gallery: []
path: ""
defaultPassword: "deluge"
releaseNotes: >-
  New: two home-screen widgets, torrent counts and active torrents. Add them
  from Edit widgets on the Umbrel home screen. If a widget looks empty after
  updating, remove it and add it again.
widgets:
  - id: "torrents"
    type: "four-stats"
    refresh: "5s"
    endpoint: "widget-server:3000/widgets/torrents"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Downloading"
          text: "3"
          subtext: "torrents"
        - title: "Seeding"
          text: "1"
          subtext: "torrent"
        - title: "Paused"
          text: "0"
          subtext: "torrents"
        - title: "Queued"
          text: "2"
          subtext: "torrents"
  - id: "active"
    type: "list"
    refresh: "5s"
    endpoint: "widget-server:3000/widgets/active"
    link: ""
    example:
      type: "list"
      link: ""
      items:
        - text: "33% • Ubuntu 22.04.3 amd64 ISO image"
          subtext: "↓4.4Mbps ↑1.2Mbps"
        - text: "100% • Ubuntu 21.1.0 amd64 ISO image"
          subtext: "↓0Mbps ↑78Kbps"
        - text: "100% • Debian 11.0 amd64 ISO image"
          subtext: "↓0Mbps ↑827Kbps"
submitter: dxD7
submission: https://github.com/dxD7/dxD7-Umbrel-store
